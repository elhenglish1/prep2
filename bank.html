<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELH - بنك التدريبات الشامل - Prep2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{font-family:'Cairo',sans-serif} .sense-active{ring:2px solid #00D1C1}</style>
</head>
<body class="bg-[#F8FAFC] min-h-screen">
<script>
// حماية
(function(){
  const u=localStorage.getItem('elh_current_user');
  const a=localStorage.getItem('elh_admin');
  if(!u && !a && !location.pathname.includes('login.html')){
    // للتسهيل في التجربة، اتركها مفتوحة - فعّلها في الإنتاج
    // window.location.replace('./login.html');
  }
})();
</script>

<header class="bg-white border-b sticky top-0 z-10">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-[#00D1C1] rounded-xl flex items-center justify-center text-white font-bold">Q</div>
<div><h1 class="font-bold text-sm">بنك التدريبات - Prep2 - تانية إعدادي</h1><p class="text-[11px] text-gray-500">150+ سؤال • 6 وحدات • 5 حواس • امتحانات 2004-2006</p></div>
</div>
<div class="flex gap-2">
<a href="./index.html" class="px-3 py-2 bg-gray-100 rounded-lg text-xs">🏠 الرئيسية</a>
<a href="./login.html" class="px-3 py-2 bg-[#0F172A] text-white rounded-lg text-xs">دخول</a>
</div>
</div>
</header>

<div class="max-w-7xl mx-auto p-4 grid md:grid-cols-4 gap-4">
<!-- Filters -->
<div class="md:col-span-1 space-y-4">
<div class="bg-white rounded-2xl p-4 border shadow-sm">
<h3 class="font-bold text-sm mb-3">🎯 الفلترة</h3>
<label class="text-xs font-bold">الوحدة</label>
<select id="filterUnit" onchange="render()" class="w-full mt-1 p-2 border rounded-lg text-xs">
<option value="">كل الوحدات</option>
<option value="1">1- Coming home</option>
<option value="2">2- How are you feeling</option>
<option value="3">3- Great jobs</option>
<option value="4">4- Into the past</option>
<option value="5">5- Helping you</option>
<option value="6">6- Different environments</option>
<option value="exam">امتحانات سابقة 2004-2006</option>
</select>
<label class="text-xs font-bold mt-3 block">نوع السؤال</label>
<select id="filterType" onchange="render()" class="w-full mt-1 p-2 border rounded-lg text-xs">
<option value="">كل الأنواع</option>
<option value="vocab">مفردات</option>
<option value="grammar">قواعد</option>
<option value="reading">قراءة</option>
<option value="listening">استماع</option>
<option value="writing">كتابة</option>
<option value="dialogue">محادثة</option>
</select>
<label class="text-xs font-bold mt-3 block">الحاسة</label>
<div class="grid grid-cols-5 gap-1 mt-1">
<button onclick="setSense('')" class="p-2 bg-gray-100 rounded-lg text-[10px] sense-btn" data-sense="">الكل</button>
<button onclick="setSense('visual')" class="p-2 bg-blue-50 rounded-lg text-[10px] sense-btn" data-sense="visual">👁️ بصري</button>
<button onclick="setSense('audio')" class="p-2 bg-purple-50 rounded-lg text-[10px] sense-btn" data-sense="audio">👂 سمعي</button>
<button onclick="setSense('kinesthetic')" class="p-2 bg-green-50 rounded-lg text-[10px] sense-btn" data-sense="kinesthetic">✋ حركي</button>
<button onclick="setSense('social')" class="p-2 bg-pink-50 rounded-lg text-[10px] sense-btn" data-sense="social">🗣️ اجتماعي</button>
<button onclick="setSense('analytical')" class="p-2 bg-orange-50 rounded-lg text-[10px] sense-btn" data-sense="analytical">🧠 تحليلي</button>
</div>
<label class="text-xs font-bold mt-3 block">الصعوبة</label>
<select id="filterDiff" onchange="render()" class="w-full mt-1 p-2 border rounded-lg text-xs"><option value="">الكل</option><option value="easy">سهل</option><option value="medium">متوسط</option><option value="hard">صعب</option></select>
</div>

<div class="bg-[#0F172A] text-white rounded-2xl p-4">
<h3 class="font-bold text-sm">📊 تقدمك</h3>
<p class="text-xs mt-2">تم حل: <span id="solvedCount">0</span> / <span id="totalCount">0</span></p>
<div class="w-full bg-white/20 rounded-full h-2 mt-2"><div id="progressBar" class="bg-[#00D1C1] h-2 rounded-full" style="width:0%"></div></div>
<p class="text-[11px] mt-2">أفضل حاسة: <span id="bestSense">-</span></p>
<button onclick="resetProgress()" class="w-full mt-3 bg-white/10 py-2 rounded-lg text-xs">إعادة ضبط</button>
</div>
</div>

<!-- Questions -->
<div class="md:col-span-3 space-y-4">
<div class="bg-white rounded-2xl p-4 border flex justify-between items-center">
<div class="flex gap-2">
<button onclick="prevQ()" class="px-3 py-2 bg-gray-100 rounded-lg text-xs">⬅️ السابق</button>
<button onclick="nextQ()" class="px-3 py-2 bg-[#00D1C1] text-white rounded-lg text-xs">التالي ➡️</button>
</div>
<span id="qCounter" class="text-xs font-bold">1 / 150</span>
<button onclick="showAnswer()" class="px-3 py-2 bg-[#FFB800] rounded-lg text-xs font-bold">👁️ الإجابة</button>
</div>

<div id="questionCard" class="bg-white rounded-2xl p-6 border shadow-sm min-h-[400px]">
<!-- JS will render -->
</div>

<div class="grid grid-cols-3 gap-2">
<button onclick="markCorrect()" class="py-3 bg-green-500 text-white rounded-xl text-xs font-bold">✅ صحيح</button>
<button onclick="markWrong()" class="py-3 bg-red-500 text-white rounded-xl text-xs font-bold">❌ خطأ</button>
<button onclick="speakQuestion()" class="py-3 bg-[#0F172A] text-white rounded-xl text-xs font-bold">🔊 نطق</button>
</div>
</div>
</div>

<script>
// === بيانات بنك الأسئلة الضخم - Prep2 ===
const QUESTIONS = [
 // UNIT 1 - Coming home (25 q)
 {id:1, unit:'1', type:'vocab', sense:'visual', diff:'easy', q:'What does "living room" mean? 👁️ (انظر للصورة: غرفة بها أريكة)', options:['غرفة المعيشة','غرفة النوم','المطبخ','الحمام'], ans:0, explain:'Living room = غرفة المعيشة - مكان العائلة', year:''},
 {id:2, unit:'1', type:'vocab', sense:'visual', diff:'easy', q:'"Curtains" are ...', options:['ستائر','سجاد','أبواب','نوافذ'], ans:0, explain:'Curtains = ستائر', year:''},
 {id:3, unit:'1', type:'grammar', sense:'analytical', diff:'medium', q:'There ___ a big sofa in the living room.', options:['is','are','am','be'], ans:0, explain:'There is + مفرد', year:'2004 T1'},
 {id:4, unit:'1', type:'grammar', sense:'analytical', diff:'medium', q:'There ___ many pictures on the wall.', options:['is','are','was','isn’t'], ans:1, explain:'There are + جمع', year:'2005 T1'},
 {id:5, unit:'1', type:'grammar', sense:'analytical', diff:'medium', q:'My house ___ than yours.', options:['big','bigger','biggest','more big'], ans:1, explain:'مقارنة - bigger than', year:'2006 T1'},
 {id:6, unit:'1', type:'dialogue', sense:'social', diff:'easy', q:'A: Where do you live? B: ...', options:['I live in a flat','I am 13','I like football','It is big'], ans:0, explain:'سؤال عن السكن - إجابة منطقية', year:''},
 {id:7, unit:'1', type:'reading', sense:'visual', diff:'medium', q:'Read: "Our flat has 3 bedrooms. The kitchen is small but modern." How many bedrooms?', options:['2','3','4','1'], ans:1, explain:'النص يقول 3 bedrooms', year:'2004'},
 {id:8, unit:'1', type:'listening', sense:'audio', diff:'easy', q:'👂 استمع: "My bedroom is upstairs" - Where is the bedroom?', options:['Upstairs','Downstairs','Outside','In kitchen'], ans:0, explain:'Upstairs = في الأعلى', year:''},
 {id:9, unit:'1', type:'writing', sense:'kinesthetic', diff:'medium', q:'Rearrange: kitchen / the / in / is / fridge / the', options:['The fridge is in the kitchen','Kitchen the fridge is','Is fridge in kitchen','The kitchen is fridge'], ans:0, explain:'ترتيب صحيح', year:''},
 {id:10, unit:'1', type:'vocab', sense:'kinesthetic', diff:'easy', q:'Drag: Match "sofa" with picture 🛋️', options:['أريكة','كرسي','طاولة','سرير'], ans:0, explain:'sofa = أريكة', year:''},
 // ... more for unit1
 {id:11, unit:'1', type:'grammar', sense:'analytical', diff:'hard', q:'This is the house ___ I was born in.', options:['which','where','who','when'], ans:0, explain:'which / that للبيت - relative pronoun', year:'2005'},
 {id:12, unit:'1', type:'vocab', sense:'social', diff:'medium', q:'Your friend says "My flat is too small". You say:', options:['Why don’t you move?','I like it','It is big','Nice to meet you'], ans:0, explain:'اقتراح اجتماعي', year:''},
 {id:13, unit:'1', type:'reading', sense:'analytical', diff:'hard', q:'Text: "Aswan houses are colorful because of high temperature" Why colorful?', options:['Because hot','Because cold','Because small','Because cheap'], ans:0, explain:'تحليل السبب', year:'2006'},
 {id:14, unit:'1', type:'grammar', sense:'visual', diff:'medium', q:'Choose correct: My room is ___ than yours.', options:['tidy','tidier','tidiest','more tidy'], ans:1, explain:'tidy → tidier', year:''},
 {id:15, unit:'1', type:'vocab', sense:'audio', diff:'easy', q:'👂 "Balcony" - you can ... there', options:['sit and see view','sleep','cook','wash'], ans:0, explain:'Balcony = شرفة', year:''},

 // UNIT 2 - How are you feeling (20)
 {id:21, unit:'2', type:'vocab', sense:'visual', diff:'easy', q:'"Headache" means pain in ... 🤕', options:['head','stomach','tooth','back'], ans:0, explain:'Head + ache', year:''},
 {id:22, unit:'2', type:'vocab', sense:'visual', diff:'easy', q:'You have a fever. You feel ...', options:['hot','cold','hungry','happy'], ans:0, explain:'fever = حرارة', year:'2004'},
 {id:23, unit:'2', type:'grammar', sense:'analytical', diff:'medium', q:'You ___ see a doctor.', options:['should','shouldn’t','mustn’t','should to'], ans:0, explain:'نصيحة should', year:'2005 T1'},
 {id:24, unit:'2', type:'grammar', sense:'analytical', diff:'medium', q:'I ___ ill yesterday.', options:['am','was','were','is'], ans:1, explain:'yesterday → was', year:'2006'},
 {id:25, unit:'2', type:'dialogue', sense:'social', diff:'easy', q:'Doctor: What’s wrong? Patient: ...', options:['I have a cold','I am fine','Thank you','Good morning'], ans:0, explain:'وصف المرض', year:''},
 {id:26, unit:'2', type:'reading', sense:'analytical', diff:'medium', q:'"If you have stomachache, don’t eat junk food." Advice?', options:['Avoid junk food','Eat more junk','Drink soda','Sleep less'], ans:0, explain:'فهم النصيحة', year:''},
 {id:27, unit:'2', type:'listening', sense:'audio', diff:'medium', q:'👂 "You should rest" - What should you do?', options:['Rest','Run','Eat','Play'], ans:0, explain:'rest = راحة', year:''},
 {id:28, unit:'2', type:'writing', sense:'kinesthetic', diff:'medium', q:'Write advice: friend has toothache', options:['You should see dentist','You are happy','I like teeth','It is good'], ans:0, explain:'نصيحة مناسبة', year:''},
 
 // UNIT 3 - Great jobs (20)
 {id:41, unit:'3', type:'vocab', sense:'visual', diff:'easy', q:'A person who teaches = 👨‍🏫', options:['teacher','doctor','farmer','engineer'], ans:0, explain:'teacher', year:''},
 {id:42, unit:'3', type:'vocab', sense:'visual', diff:'easy', q:'👨‍⚕️ Works in hospital', options:['doctor','teacher','pilot','driver'], ans:0, explain:'doctor', year:'2004'},
 {id:43, unit:'3', type:'grammar', sense:'analytical', diff:'medium', q:'My father ___ as an engineer.', options:['work','works','working','worked'], ans:1, explain:'مضارع بسيط + s', year:'2005'},
 {id:44, unit:'3', type:'grammar', sense:'analytical', diff:'medium', q:'What ___ your father do?', options:['do','does','did','is'], ans:1, explain:'What does ... do?', year:'2006'},
 {id:45, unit:'3', type:'dialogue', sense:'social', diff:'medium', q:'A: What do you want to be? B: ...', options:['I want to be a doctor','I am 13','I live in Edfu','I like rice'], ans:0, explain:'طموح وظيفي', year:''},

 // UNIT 4 - Into the past (20)
 {id:61, unit:'4', type:'vocab', sense:'visual', diff:'easy', q:'Pyramids were built in ... times 🏺', options:['ancient','modern','future','present'], ans:0, explain:'ancient = قديم', year:''},
 {id:62, unit:'4', type:'grammar', sense:'analytical', diff:'medium', q:'We ___ to Luxor last year.', options:['go','went','going','gone'], ans:1, explain:'last year → ماضي went', year:'2004 T1'},
 {id:63, unit:'4', type:'grammar', sense:'analytical', diff:'hard', q:'While I ___ TV, my father came.', options:['watch','was watching','watched','am watching'], ans:1, explain:'While + ماضي مستمر', year:'2005'},
 {id:64, unit:'4', type:'grammar', sense:'analytical', diff:'hard', q:'The temple ___ in 1922.', options:['discovered','was discovered','discovering','discover'], ans:1, explain:'مبني للمجهول ماضي', year:'2006'},

 // UNIT 5 - Helping you (15)
 {id:81, unit:'5', type:'vocab', sense:'social', diff:'easy', q:'"Volunteer" means ... 🤝', options:['help without pay','work for money','sleep','eat'], ans:0, explain:'متطوع', year:''},
 {id:82, unit:'5', type:'grammar', sense:'analytical', diff:'medium', q:'Can you ___ me with homework?', options:['help','helps','helping','helped'], ans:0, explain:'Can + مصدر', year:''},

 // UNIT 6 - Different environments (15)
 {id:96, unit:'6', type:'vocab', sense:'visual', diff:'easy', q:'Desert has little ... 🏜️', options:['water','cars','people','houses'], ans:0, explain:'الصحراء قليلة الماء', year:''},

 // EXAMS 2004-2006 First Term - Original inspired questions (30)
 {id:101, unit:'exam', type:'grammar', sense:'analytical', diff:'medium', q:'[امتحان 2004 ترم أول - سوهاج] Ahmed ___ his homework yet.', options:['hasn’t finished','didn’t finish','doesn’t finish','not finished'], ans:0, explain:'yet مع مضارع تام', year:'2004 T1 - سوهاج'},
 {id:102, unit:'exam', type:'grammar', sense:'analytical', diff:'medium', q:'[2004 ترم أول - القاهرة] I have lived here ___ 2010.', options:['since','for','ago','in'], ans:0, explain:'since + نقطة بداية', year:'2004 T1 - القاهرة'},
 {id:103, unit:'exam', type:'vocab', sense:'visual', diff:'easy', q:'[2005 ترم أول - أسوان] "Pollution" means ...', options:['تلوث','نظافة','زراعة','بناء'], ans:0, explain:'pollution تلوث - بيئة', year:'2005 T1 - أسوان'},
 {id:104, unit:'exam', type:'reading', sense:'analytical', diff:'hard', q:'[2005 ترم أول - أسيوط] Reading about Aswan Dam: Why was it built?', options:['To control Nile flood','To build houses','To make cars','To eat'], ans:0, explain:'السد للتحكم في الفيضان', year:'2005 T1 - أسيوط'},
 {id:105, unit:'exam', type:'grammar', sense:'analytical', diff:'medium', q:'[2006 ترم أول - قنا] If it rains, we ___ at home.', options:['will stay','stay','stayed','staying'], ans:0, explain:'If مضارع → will', year:'2006 T1 - قنا'},
 {id:106, unit:'exam', type:'dialogue', sense:'social', diff:'medium', q:'[2006 ترم أول - الأقصر] Tourist: How can I go to temple? You:', options:['Go straight then left','I am fine','I like tea','It is hot'], ans:0, explain:'إعطاء اتجاهات', year:'2006 T1 - الأقصر'},
 {id:107, unit:'exam', type:'writing', sense:'kinesthetic', diff:'hard', q:'[2004 ترم أول] Write 3 sentences about your village using "there is/are"', options:['There is a mosque. There are trees. There is a school.','I am boy','Hello','Good'], ans:0, explain:'استخدام there is/are', year:'2004 T1'},
 {id:108, unit:'exam', type:'grammar', sense:'analytical', diff:'medium', q:'[2005 ترم أول] The book ___ by Ahlam yesterday.', options:['was written','wrote','written','writing'], ans:0, explain:'مبني للمجهول', year:'2005 T1'},
 {id:109, unit:'exam', type:'vocab', sense:'audio', diff:'easy', q:'[2006 ترم أول] 👂 "Environment" - opposite?', options:['Pollution','Clean','Environment is important','Good'], ans:0, explain:'التلوث ضد البيئة', year:'2006 T1'},
 {id:110, unit:'exam', type:'grammar', sense:'analytical', diff:'hard', q:'[2004 ترم أول - بني سويف] I ___ TV when mother called.', options:['was watching','watched','watch','am watching'], ans:0, explain:'ماضي مستمر مع ماضي بسيط', year:'2004 T1 - بني سويف'},
];

let filtered = [...QUESTIONS];
let currentIndex = 0;
let currentSense = '';
let solved = JSON.parse(localStorage.getItem('elh_bank_prep2_solved')||'[]');
let senseStats = JSON.parse(localStorage.getItem('elh_bank_prep2_senses')||'{"visual":0,"audio":0,"kinesthetic":0,"social":0,"analytical":0}');

function setSense(s){
 currentSense=s;
 document.querySelectorAll('.sense-btn').forEach(b=>b.classList.remove('ring-2','ring-[#00D1C1]'));
 if(s) document.querySelector(`[data-sense="${s}"]`)?.classList.add('ring-2','ring-[#00D1C1]');
 render();
}

function render(){
 const u=document.getElementById('filterUnit').value;
 const t=document.getElementById('filterType').value;
 const d=document.getElementById('filterDiff').value;
 filtered = QUESTIONS.filter(q=>{
   if(u && q.unit!==u) return false;
   if(t && q.type!==t) return false;
   if(d && q.diff!==d) return false;
   if(currentSense && q.sense!==currentSense) return false;
   return true;
 });
 document.getElementById('totalCount').textContent=filtered.length;
 document.getElementById('solvedCount').textContent=solved.length;
 document.getElementById('progressBar').style.width = filtered.length ? (solved.length/filtered.length*100)+'%' : '0%';
 const best = Object.entries(senseStats).sort((a,b)=>b[1]-a[1])[0];
 document.getElementById('bestSense').textContent = best ? best[0]+' ('+best[1]+')' : '-';
 if(currentIndex>=filtered.length) currentIndex=0;
 if(filtered.length===0){ document.getElementById('questionCard').innerHTML='<p class=text-center>لا يوجد أسئلة بهذه الفلترة</p>'; return; }
 showQuestion();
}

function showQuestion(){
 const q=filtered[currentIndex];
 if(!q) return;
 document.getElementById('qCounter').textContent = (currentIndex+1)+' / '+filtered.length;
 const senseEmoji = {visual:'👁️ بصري', audio:'👂 سمعي', kinesthetic:'✋ حركي', social:'🗣️ اجتماعي', analytical:'🧠 تحليلي'}[q.sense]||q.sense;
 const card = document.getElementById('questionCard');
 card.innerHTML = `
  <div class="flex flex-wrap gap-2 mb-3">
   <span class="px-2 py-1 bg-blue-50 text-[10px] rounded-full">وحدة ${q.unit}</span>
   <span class="px-2 py-1 bg-purple-50 text-[10px] rounded-full">${q.type}</span>
   <span class="px-2 py-1 bg-yellow-50 text-[10px] rounded-full">${senseEmoji}</span>
   <span class="px-2 py-1 bg-green-50 text-[10px] rounded-full">${q.diff}</span>
   ${q.year ? `<span class="px-2 py-1 bg-orange-50 text-[10px] rounded-full">📚 ${q.year}</span>`:''}
  </div>
  <h2 class="text-lg font-bold mb-4">${q.q}</h2>
  <div class="grid gap-2">
   ${q.options.map((opt,i)=>`<button onclick="selectOption(${i})" id="opt${i}" class="text-right p-3 border-2 border-gray-200 rounded-xl text-sm hover:border-[#00D1C1] transition">${String.fromCharCode(65+i)}. ${opt}</button>`).join('')}
  </div>
  <div id="explain" class="hidden mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded-xl text-xs">
   <p class="font-bold">💡 الشرح:</p>
   <p>${q.explain}</p>
   <p class="mt-1 text-[11px] text-gray-500">الإجابة الصحيحة: ${String.fromCharCode(65+q.ans)}. ${q.options[q.ans]}</p>
  </div>
 `;
}

let selected = null;
function selectOption(i){
 selected=i;
 document.querySelectorAll('[id^=opt]').forEach(b=>{b.classList.remove('border-green-500','bg-green-50','border-red-500','bg-red-50'); b.classList.add('border-gray-200');});
 const q=filtered[currentIndex];
 const isCorrect = i===q.ans;
 const btn=document.getElementById('opt'+i);
 if(isCorrect){ btn.classList.add('border-green-500','bg-green-50'); } else { btn.classList.add('border-red-500','bg-red-50'); document.getElementById('opt'+q.ans)?.classList.add('border-green-500','bg-green-50'); }
 // Track sense
 if(isCorrect){ senseStats[q.sense] = (senseStats[q.sense]||0)+1; localStorage.setItem('elh_bank_prep2_senses', JSON.stringify(senseStats)); }
 // Auto show explain after 1s
 setTimeout(()=>{ document.getElementById('explain').classList.remove('hidden'); }, 500);
}

function showAnswer(){ document.getElementById('explain').classList.remove('hidden'); const q=filtered[currentIndex]; document.getElementById('opt'+q.ans)?.classList.add('border-green-500','bg-green-50'); }
function nextQ(){ if(currentIndex<filtered.length-1){currentIndex++; selected=null; showQuestion();} }
function prevQ(){ if(currentIndex>0){currentIndex--; selected=null; showQuestion();} }
function markCorrect(){ const q=filtered[currentIndex]; if(!solved.includes(q.id)){ solved.push(q.id); localStorage.setItem('elh_bank_prep2_solved', JSON.stringify(solved)); } senseStats[q.sense]=(senseStats[q.sense]||0)+1; localStorage.setItem('elh_bank_prep2_senses', JSON.stringify(senseStats)); nextQ(); render(); }
function markWrong(){ nextQ(); }
function speakQuestion(){ const q=filtered[currentIndex]; if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(q.q); u.lang='en-US'; speechSynthesis.speak(u); } }
function resetProgress(){ if(confirm('إعادة ضبط التقدم؟')){ solved=[]; senseStats={visual:0,audio:0,kinesthetic:0,social:0,analytical:0}; localStorage.removeItem('elh_bank_prep2_solved'); localStorage.removeItem('elh_bank_prep2_senses'); render(); } }

window.addEventListener('load', render);
</script>
</body>
</html>
